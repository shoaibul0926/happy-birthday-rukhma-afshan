<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Rukhma & Afshan</title>
<style>
  :root {
    --pink: #ff6fa5;
    --purple: #7b5cff;
    --gold: #ffd166;
    --bg-1: #1b1033;
    --bg-2: #3a1c5c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    background: radial-gradient(circle at top, var(--bg-2), var(--bg-1));
    color: #fff;
    overflow-x: hidden;
  }

  .sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .balloon {
    position: absolute;
    bottom: -120px;
    width: 42px;
    height: 54px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: 0.85;
    animation: float 14s linear infinite;
  }
  .balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 60px;
    background: rgba(255,255,255,0.4);
  }

  @keyframes float {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); }
    50%  { transform: translateY(-55vh) translateX(20px) rotate(5deg); }
    100% { transform: translateY(-115vh) translateX(-10px) rotate(-5deg); }
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    text-align: center;
  }

  h1 {
    font-size: clamp(1.8rem, 7vw, 3.2rem);
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--pink), var(--gold), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
    opacity: 0;
    animation: dropIn 0.8s 0.1s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .subtitle {
    font-size: clamp(1rem, 3vw, 1.25rem);
    color: #e3d9ff;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 0.7s 0.5s ease forwards;
  }

  .choices {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 0.7s 0.8s ease forwards;
  }

  @keyframes dropIn {
    0%   { opacity: 0; transform: translateY(-40px) scale(0.8); }
    60%  { opacity: 1; transform: translateY(6px) scale(1.03); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .choice-btn {
    font-size: 1.1rem;
    font-weight: 600;
    padding: 16px 34px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #1b1033;
    background: linear-gradient(135deg, var(--gold), var(--pink));
    box-shadow: 0 8px 24px rgba(255, 111, 165, 0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .choice-btn:nth-child(2) {
    background: linear-gradient(135deg, #a78bfa, var(--purple));
    color: #fff;
    box-shadow: 0 8px 24px rgba(123, 92, 255, 0.35);
  }
  .choice-btn:hover {
    transform: translateY(-3px) scale(1.03);
  }

  .card {
    display: none;
    max-width: 620px;
    width: 100%;
    margin-top: 32px;
    padding: 28px 26px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    animation: appear 0.4s ease;
  }
  .card.visible { display: block; }

  @keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card h2 {
    margin-top: 0;
    font-size: 1.4rem;
    color: var(--gold);
  }

  .card p {
    white-space: pre-line;
    line-height: 1.7;
    font-size: 1.05rem;
    color: #f4f0ff;
  }

  .gift-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 28px 0;
    cursor: pointer;
  }

  .gift-box {
    position: relative;
    width: 130px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    box-shadow: 0 12px 28px rgba(123, 92, 255, 0.4);
    animation: wiggle 2.2s ease-in-out infinite;
  }
  .gift-box::before,
  .gift-box::after {
    content: "";
    position: absolute;
    background: var(--gold);
  }
  .gift-box::before {
    width: 100%;
    height: 18px;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
  }
  .gift-box::after {
    width: 18px;
    height: 100%;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
  }
  .gift-box span {
    position: relative;
    z-index: 1;
  }
  .gift-box.opening {
    animation: popOpen 0.55s ease forwards;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }
  @keyframes popOpen {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    40%  { transform: scale(1.25) rotate(-10deg); opacity: 1; }
    100% { transform: scale(0.1) rotate(25deg); opacity: 0; }
  }

  .gift-hint {
    font-size: 0.9rem;
    color: #e3d9ff;
    opacity: 0.85;
  }

  .message {
    display: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .message.visible {
    display: block;
    opacity: 1;
  }

  .back-btn {
    margin-top: 18px;
    background: none;
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 8px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .back-btn:hover {
    background: rgba(255,255,255,0.1);
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 18px;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
  }

  @media (max-width: 480px) {
    main {
      padding: 24px 14px;
      justify-content: flex-start;
      padding-top: 48px;
    }

    .choices {
      flex-direction: column;
      width: 100%;
      gap: 14px;
    }

    .choice-btn {
      width: 100%;
      padding: 15px 20px;
      font-size: 1rem;
    }

    .card {
      padding: 20px 18px;
      margin-top: 24px;
      border-radius: 16px;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.6;
    }

    .gift-box {
      width: 110px;
      height: 94px;
      font-size: 2.5rem;
    }

    .balloon {
      width: 32px;
      height: 42px;
    }
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<main>
  <h1>Happy Birthday, Rukhma & Afshan! 🎂</h1>
  <p class="subtitle">Pick one to open your surprise</p>

  <div class="choices" id="choices">
    <button class="choice-btn" onclick="showCard('note')">💌 Note</button>
    <button class="choice-btn" onclick="showCard('shayri')">✨ Shayri</button>
  </div>

  <div class="card" id="note-card">
    <h2>A Note For You</h2>
    <div class="gift-wrap" id="note-gift" onclick="unwrapGift('note')">
      <div class="gift-box"><span>🎁</span></div>
      <p class="gift-hint">Tap to unwrap</p>
    </div>
    <div class="message" id="note-message">
    <p id="note-text">Your note will appear here soon...</p>
    </div>
    <button class="back-btn" onclick="hideCards()">← Back</button>
  </div>

  <div class="card" id="shayri-card">
    <h2>A Shayri For You</h2>
    <div class="gift-wrap" id="shayri-gift" onclick="unwrapGift('shayri')">
      <div class="gift-box"><span>🎁</span></div>
      <p class="gift-hint">Tap to unwrap</p>
    </div>
    <div class="message" id="shayri-message">
    <p id="shayri-text">Your shayri will appear here soon...</p>
    </div>
    <button class="back-btn" onclick="hideCards()">← Back</button>
  </div>
</main>

<footer>Made with love for Rukhma & Afshan's birthday</footer>

<script>
  function showCard(which) {
    document.getElementById('choices').style.display = 'none';
    ['note', 'shayri'].forEach(function (key) {
      document.getElementById(key + '-card').classList.remove('visible');
      var gift = document.getElementById(key + '-gift');
      gift.style.display = 'flex';
      gift.querySelector('.gift-box').classList.remove('opening');
      document.getElementById(key + '-message').classList.remove('visible');
    });
    document.getElementById(which + '-card').classList.add('visible');
  }

  function unwrapGift(which) {
    var gift = document.getElementById(which + '-gift');
    var message = document.getElementById(which + '-message');
    gift.querySelector('.gift-box').classList.add('opening');
    setTimeout(function () {
      gift.style.display = 'none';
      message.classList.add('visible');
    }, 550);
  }

  function hideCards() {
    document.getElementById('note-card').classList.remove('visible');
    document.getElementById('shayri-card').classList.remove('visible');
    document.getElementById('choices').style.display = 'flex';
  }

  (function createBalloons() {
    const colors = ['#ff6fa5', '#ffd166', '#7b5cff', '#5ad1c9', '#ff9f68'];
    const sky = document.getElementById('sky');
    const count = 10;
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = (Math.random() * 100) + 'vw';
      b.style.background = colors[i % colors.length];
      b.style.animationDelay = (Math.random() * 14) + 's';
      b.style.animationDuration = (10 + Math.random() * 8) + 's';
      sky.appendChild(b);
    }
  })();
</script>

</body>
</html>
